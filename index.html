<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Root Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: one phone column. Tabs pinned on top, money + room, big tap
     zone, shop list below. Dark CRT pixel look; single theme by design. */
  :root {
    /* Red neon = action (tap axis, money, hack button). Cyan screens =
       systems (idle axis, timers, collect, levels). Warm plaster browns
       for panels and borders, like the room's walls. */
    --bg: #0a0708;
    --panel: #15100f;
    --panel-2: #1d1614;
    --border: #3a2a24;
    --fg: #ead9cf;
    --dim: #8a7468;
    --red: #ff3344;
    --red-dim: #7a1228;
    --red-glow: rgba(255, 51, 68, .45);
    --blue: #35e0dc;
    --blue-dim: #136b69;
    --blue-deep: #0b2a2c;
    --blue-glow: rgba(53, 224, 220, .45);
    --font-display: 'Press Start 2P', 'Courier New', monospace;
    --font-body: 'VT323', 'Courier New', monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 20px;
    line-height: 1.2;
    -webkit-font-smoothing: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  body.shake { animation: shake 180ms steps(4) 1; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, -2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.shake { animation: none; }
    .pop { animation-duration: 1ms; }
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex; flex-direction: column; gap: 10px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    padding-block: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--red);
    text-shadow: 0 0 6px var(--red-glow);
  }
  h1 small { color: var(--dim); font-size: 8px; display: block; margin-top: 4px; letter-spacing: 2px; }
  .iconbtn {
    font-family: var(--font-display); font-size: 9px;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--border); padding: 8px 10px; cursor: pointer;
  }
  .iconbtn:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* Variant tabs */
  .tabs { display: flex; flex-direction: column; gap: 6px; }
  .tabrow { display: flex; align-items: stretch; gap: 4px; }
  .tabrow .axis {
    font-family: var(--font-display); font-size: 8px; color: var(--dim);
    width: 42px; flex: none; display: flex; align-items: center;
  }
  .tabrow button {
    flex: 1; min-width: 0;
    font-family: var(--font-display); font-size: 8px; letter-spacing: .5px;
    padding: 10px 4px;
    background: var(--panel); color: var(--dim);
    border: 2px solid var(--border); cursor: pointer;
  }
  .tabrow button[aria-selected="true"] {
    color: var(--bg); background: var(--red); border-color: var(--red);
    box-shadow: 0 0 10px var(--red-glow);
  }
  #idleTabs button[aria-selected="true"] {
    color: var(--fg); background: var(--blue-dim); border-color: var(--blue);
    box-shadow: 0 0 10px var(--blue-glow);
  }

  /* Money */
  .money {
    text-align: center; padding: 4px 0 0;
  }
  .money .amount {
    font-size: 48px; line-height: 1; color: var(--red);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px var(--red-glow);
  }
  .money .rates { color: var(--dim); font-size: 18px; margin-top: 2px; }
  .money .rates b { color: var(--fg); font-weight: normal; }
  .money .rates b.idle { color: var(--blue); }

  /* House: isometric floor plan at a fixed scale; scrolls sideways */
  .room {
    position: relative;
    border: 2px solid var(--border);
    background: #07050a;
    height: 304px; max-width: 100%;
    overflow: hidden;
  }
  .roomScroll { overflow: auto; height: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none; cursor: grab; }
  .roomScroll.dragging { cursor: grabbing; }
  .roomScroll::-webkit-scrollbar { display: none; }
  .room canvas { width: 912px; height: 612px; display: block; image-rendering: pixelated; }
  .roomLabel {
    position: absolute; left: 8px; top: 6px; pointer-events: none;
    font-family: var(--font-display); font-size: 7px; letter-spacing: 1px; color: var(--dim);
    text-shadow: 0 0 4px #000;
  }
  .roomLabel b { color: var(--blue); font-weight: normal; }
  .room::after { /* scanlines */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px);
  }

  /* Tap zone */
  .tapzone { position: relative; }
  .hack {
    width: 100%;
    font-family: var(--font-display); font-size: 16px; letter-spacing: 2px;
    padding: 28px 12px;
    color: var(--bg); background: var(--red);
    border: 0; border-bottom: 6px solid var(--red-dim);
    cursor: pointer;
    position: relative; overflow: hidden;
    transition: transform 60ms steps(2);
  }
  .hack.squash { transform: scale(.96, .92) translateY(3px); border-bottom-width: 2px; }
  .hack.running { background: var(--panel-2); color: var(--fg); border-bottom-color: var(--border); }
  .hack.ready { background: var(--blue); color: var(--bg); border-bottom-color: var(--blue-dim); animation: pulse 700ms steps(2) infinite; }
  @keyframes pulse { 50% { filter: brightness(1.25); } }
  .hack .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(79,141,255,.45); pointer-events: none;
  }
  .hack.running .fill { background: rgba(79,141,255,.3); }
  .hack .label { position: relative; display: block; }
  .hack .sub { position: relative; display: block; font-family: var(--font-body); font-size: 18px; letter-spacing: 0; margin-top: 8px; opacity: .85; }
  .pop {
    position: absolute; pointer-events: none;
    font-size: 26px; color: var(--red); text-shadow: 0 0 6px var(--red-glow);
    animation: pop 800ms steps(8) forwards;
    will-change: transform, opacity;
  }
  .pop.big { font-size: 36px; color: var(--blue); text-shadow: 0 0 8px var(--blue-glow); }
  @keyframes pop {
    from { transform: translate(-50%, 0); opacity: 1; }
    to   { transform: translate(-50%, -90px); opacity: 0; }
  }

  /* Shop */
  .shop { display: flex; flex-direction: column; gap: 6px; }
  .shop h2 {
    margin: 4px 0 0; font-family: var(--font-display); font-size: 9px; color: var(--dim); letter-spacing: 2px;
  }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
    background: var(--panel); border: 2px solid var(--border); padding: 8px 10px;
  }
  .item .name { font-size: 22px; }
  .item .name .lvl { color: var(--blue); margin-left: 6px; }
  .item .effect { color: var(--dim); font-size: 17px; }
  .item .effect b { color: var(--fg); font-weight: normal; }
  .item button {
    grid-row: 1 / span 2;
    font-family: var(--font-display); font-size: 9px;
    min-width: 92px; padding: 12px 8px;
    background: var(--panel-2); color: var(--red);
    border: 2px solid var(--red-dim); cursor: pointer;
  }
  .item button:disabled { color: var(--dim); border-color: var(--border); cursor: default; }
  .item button .cost { display: block; font-family: var(--font-body); font-size: 20px; margin-top: 4px; }
  .item.maxed button { color: var(--blue); border-color: var(--blue-dim); }
  .item.nospace button:disabled { color: var(--red-dim); border-color: var(--red-dim); }
  .item.expand { border-color: var(--blue-dim); }
  .item.expand button { color: var(--blue); border-color: var(--blue-dim); }

  footer { color: var(--dim); font-size: 15px; text-align: center; margin-top: 6px; }

  /* Slot overlay: Continue / New run */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,4,10,.88);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .card {
    width: 100%; max-width: 380px;
    background: var(--panel); border: 2px solid var(--red);
    box-shadow: 0 0 24px var(--red-glow);
    padding: 18px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .card h2 { margin: 0; font-family: var(--font-display); font-size: 11px; color: var(--red); line-height: 1.6; }
  .card p { margin: 0; color: var(--dim); font-size: 19px; }
  .card p b { color: var(--fg); font-weight: normal; }
  .card .actions { display: flex; flex-direction: column; gap: 8px; }
  .card button {
    font-family: var(--font-display); font-size: 10px; padding: 14px;
    border: 2px solid var(--border); background: var(--panel-2); color: var(--fg); cursor: pointer;
  }
  .card button.primary { background: var(--red); color: var(--bg); border-color: var(--red); }
  .card button.danger { color: var(--dim); border-color: var(--red-dim); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ROOT ACCESS<small>DESIGN BENCH</small></h1>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="muteBtn" aria-pressed="false" title="Toggle sound">SND</button>
      <button class="iconbtn" id="menuBtn" title="Continue or new run">RUN</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Variants">
    <div class="tabrow" role="tablist" id="tapTabs"><span class="axis">TAP</span></div>
    <div class="tabrow" role="tablist" id="idleTabs"><span class="axis">IDLE</span></div>
  </nav>

  <section class="money" aria-live="off">
    <div class="amount" id="money">$0</div>
    <div class="rates" id="rates"></div>
  </section>

  <section class="room">
    <div class="roomScroll" id="roomScroll"><canvas id="room" width="304" height="204"></canvas></div>
    <div class="roomLabel" id="roomLabel"></div>
  </section>

  <section class="tapzone" id="tapzone">
    <button class="hack" id="hack">
      <span class="fill" id="fill"></span>
      <span class="label" id="hackLabel">HACK</span>
      <span class="sub" id="hackSub"></span>
    </button>
  </section>

  <section class="shop">
    <h2>EQUIPMENT</h2>
    <div id="shop"></div>
  </section>

  <footer id="hint"></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <h2 id="ovTitle">INSTANT / EQUIPMENT</h2>
    <p id="ovBody"></p>
    <div class="actions" id="ovActions"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
  const C = window.RA_CONFIG;
  const $ = (id) => document.getElementById(id);

  // ---------- economy (pure) ----------
  const roleOf = (item, idleMode) => {
    if (idleMode === 'helpers') {
      if (item.helper) return { idle: item.idle };
      if (item.helperModeTap) return { tap: item.helperModeTap };
    }
    if (idleMode === 'none' && item.idle) return null;
    return { tap: item.tap, idle: item.idle };
  };
  const activeItems = (idleMode) => C.items.filter((it) => roleOf(it, idleMode));
  const costOf = (item, level) => Math.floor(item.baseCost * Math.pow(C.costGrowth, level));
  const tapValue = (s) => C.baseTap + activeItems(s.idle).reduce((sum, it) => sum + (roleOf(it, s.idle).tap || 0) * (s.levels[it.id] || 0), 0);
  const idleRate = (s) => activeItems(s.idle).reduce((sum, it) => sum + (roleOf(it, s.idle).idle || 0) * (s.levels[it.id] || 0), 0);

  // ---------- house layout (pure) ----------
  // Room [rx, ry] covers world tiles [rx*SIDE, rx*SIDE+SIDE). Equipment is
  // placed row by row into lit rooms, in purchase order of rooms.
  const SIDE = C.rooms.tilesPerSide, ROOM_TILES = SIDE * SIDE, maxRooms = 1 + C.rooms.order.length;
  const reserved = new Set(C.rooms.furnitureTiles.map(([x, y]) => `${x},${y}`));
  const roomList = (s) => [[0, 0], ...C.rooms.order.slice(0, (s.rooms || 1) - 1)];
  const isLit = (s, rx, ry) => roomList(s).some(([a, b]) => a === rx && b === ry);
  const roomCost = (rooms) => Math.floor(C.rooms.baseCost * Math.pow(C.rooms.costGrowth, rooms - 1));
  const capacity = (s) => roomList(s).length * ROOM_TILES - reserved.size;
  const tilesUsed = (s) => activeItems(s.idle).reduce((n, it) => n + (it.footprint || 0) * (s.levels[it.id] || 0), 0);
  const fits = (s, item) => tilesUsed(s) + (item.footprint || 0) <= capacity(s);
  const placements = (s) => {
    const free = [];
    for (const [rx, ry] of roomList(s)) for (let y = 0; y < SIDE; y++) for (let x = 0; x < SIDE; x++) {
      if (!(rx === 0 && ry === 0 && reserved.has(`${x},${y}`))) free.push([rx * SIDE + x, ry * SIDE + y]);
    }
    const out = []; let i = 0;
    for (const it of activeItems(s.idle)) {
      const n = (it.footprint || 0) * (s.levels[it.id] || 0);
      for (let k = 0; k < n && i < free.length; k++, i++) out.push({ item: it, x: free[i][0], y: free[i][1] });
    }
    return out;
  };

  const fmt = (n) => {
    const d = C.display;
    if (n < 1000) return d.currency + Math.floor(n);
    let i = 0;
    while (n >= 1000 && i < d.suffixes.length - 1) { n /= 1000; i++; }
    return d.currency + n.toFixed(d.decimals) + d.suffixes[i];
  };
  const fmtRate = (n) => (n < 10 && n !== Math.floor(n) ? C.display.currency + n.toFixed(1) : fmt(n));

  // ---------- saves ----------
  const slotKey = (tap, idle) => `ra${C.version}:${tap}-${idle}`;
  const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const freshState = (tap, idle) => ({
    tap, idle, money: 0, levels: {}, totalEarned: 0, taps: 0, rooms: 1,
    bar: { taps: 0, value: 0 }, job: null,
    createdAt: Date.now(), lastSeen: Date.now(), playedMs: 0,
  });

  let S = null;           // current state
  let lastTick = performance.now();
  let muted = load(`ra${C.version}:muted`) === true;

  const save = () => { if (!S) return; S.lastSeen = Date.now(); store(slotKey(S.tap, S.idle), S); };

  // ---------- audio (synthesized) ----------
  let AC = null;
  const audio = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; };
  const beep = (freq, dur, type = 'square', gain = 0.08, when = 0) => {
    if (muted || !C.feel.sound) return;
    const ac = audio(), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain * C.feel.volume, ac.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + when + dur);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime + when); o.stop(ac.currentTime + when + dur + 0.02);
  };
  const clack = () => {
    if (muted || !C.feel.sound) return;
    const ac = audio(), len = ac.sampleRate * 0.03, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = 0.25 * C.feel.volume;
    src.connect(f).connect(g).connect(ac.destination); src.start();
  };
  const cash = () => { beep(880, .06); beep(1320, .08, 'square', .08, .05); };
  const bigCash = () => { [660, 880, 1100, 1480].forEach((f, i) => beep(f, .09, 'square', .09, i * .06)); };
  const buySound = () => { beep(440, .05, 'triangle', .12); beep(660, .1, 'triangle', .12, .05); };
  const denied = () => beep(140, .12, 'sawtooth', .06);

  // ---------- feel ----------
  const pop = (x, y, text, big) => {
    if (!C.feel.pops) return;
    const el = document.createElement('span');
    el.className = 'pop' + (big ? ' big' : ''); el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    $('tapzone').appendChild(el);
    setTimeout(() => el.remove(), 820);
  };
  const shake = () => { if (!C.feel.shake) return; document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); };
  const squash = () => { if (!C.feel.squash) return; const h = $('hack'); h.classList.add('squash'); setTimeout(() => h.classList.remove('squash'), 70); };

  // ---------- earning ----------
  const earn = (amount, x, y, tapsWorth) => {
    S.money += amount; S.totalEarned += amount;
    const big = tapsWorth >= C.feel.shakeThresholdTaps;
    pop(x, y, '+' + fmt(amount), big);
    if (big) { shake(); bigCash(); } else cash();
    renderMoney(); renderShop(); renderHack();
  };

  const onTap = (e) => {
    const rect = $('tapzone').getBoundingClientRect();
    const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
    const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
    S.taps++;
    squash(); clack();
    const tv = tapValue(S);
    if (S.tap === 'instant') {
      earn(tv, x, y, 1);
    } else if (S.tap === 'bar') {
      const need = C.tapModes.bar.jobTaps;
      S.bar.taps++; S.bar.value += tv;
      if (S.bar.taps >= need) { const v = S.bar.value; S.bar = { taps: 0, value: 0 }; earn(v, x, y, need); }
      else renderHack();
    } else if (S.tap === 'jobs') {
      const cfg = C.tapModes.jobs;
      if (!S.job) { S.job = { start: Date.now(), value: tv * cfg.jobTapEquivalent }; beep(520, .08, 'triangle', .1); renderHack(); }
      else if (Date.now() - S.job.start >= cfg.jobDuration * 1000) { const v = S.job.value; S.job = null; earn(v, x, y, cfg.jobTapEquivalent); renderHack(); }
      else { denied(); }
    }
  };

  const buy = (item) => {
    const lvl = S.levels[item.id] || 0;
    if (lvl >= C.maxLevel) return;
    const cost = costOf(item, lvl);
    if (S.money < cost || !fits(S, item)) { denied(); return; }
    S.money -= cost; S.levels[item.id] = lvl + 1;
    buySound(); renderAll(); save();
  };
  const buyRoom = () => {
    if (S.rooms >= maxRooms) return;
    const cost = roomCost(S.rooms);
    if (S.money < cost) { denied(); return; }
    S.money -= cost; S.rooms++;
    buySound(); bigCash(); renderAll(); save();
  };

  // ---------- tick ----------
  const tick = () => {
    const now = performance.now(); const dt = Math.min(0.5, (now - lastTick) / 1000); lastTick = now;
    if (S) {
      S.playedMs += dt * 1000;
      const r = idleRate(S);
      if (r > 0) { S.money += r * dt; S.totalEarned += r * dt; renderMoney(); }
      if (S.tap === 'jobs' && S.job) renderHack();
      renderShopAffordability();
    }
    requestAnimationFrame(tick);
  };
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  // ---------- rendering ----------
  const renderMoney = () => {
    $('money').textContent = fmt(S.money);
    const r = idleRate(S);
    $('rates').innerHTML = `<b>${fmt(tapValue(S))}</b>/tap` + (r > 0 ? ` · <b class="idle">${fmtRate(r)}</b>/s` : '');
    $('roomLabel').innerHTML = `HOUSE <b>${S.rooms}/${maxRooms}</b> ROOMS · <b>${tilesUsed(S)}/${capacity(S)}</b> TILES`;
  };
  const renderHack = () => {
    const h = $('hack'), fill = $('fill'), label = $('hackLabel'), sub = $('hackSub');
    h.classList.remove('running', 'ready');
    if (S.tap === 'instant') { fill.style.width = '0%'; label.textContent = 'HACK'; sub.textContent = `+${fmt(tapValue(S))} per tap`; }
    else if (S.tap === 'bar') {
      const need = C.tapModes.bar.jobTaps;
      fill.style.width = (S.bar.taps / need * 100) + '%';
      label.textContent = 'HACK'; sub.textContent = `job ${S.bar.taps}/${need} · ${fmt(S.bar.value)} queued`;
    } else {
      const cfg = C.tapModes.jobs;
      if (!S.job) { fill.style.width = '0%'; label.textContent = 'START HACK'; sub.textContent = `${cfg.jobDuration}s · pays ${fmt(tapValue(S) * cfg.jobTapEquivalent)}`; }
      else {
        const p = Math.min(1, (Date.now() - S.job.start) / (cfg.jobDuration * 1000));
        fill.style.width = (p * 100) + '%';
        if (p >= 1) { h.classList.add('ready'); label.textContent = 'COLLECT'; sub.textContent = fmt(S.job.value); }
        else { h.classList.add('running'); label.textContent = 'HACKING…'; sub.textContent = `${Math.ceil(cfg.jobDuration * (1 - p))}s`; }
      }
    }
  };
  const describe = (item) => {
    const r = roleOf(item, S.idle);
    return r.tap ? `+<b>${fmt(r.tap)}</b>/tap each` : `+<b>${fmtRate(r.idle)}</b>/s each`;
  };
  const renderShop = () => {
    const shop = $('shop'); shop.innerHTML = '';
    for (const item of activeItems(S.idle)) {
      const lvl = S.levels[item.id] || 0, maxed = lvl >= C.maxLevel, cost = costOf(item, lvl), room = fits(S, item);
      const el = document.createElement('div');
      el.className = 'item' + (maxed ? ' maxed' : '') + (!maxed && !room ? ' nospace' : ''); el.dataset.id = item.id;
      const label = maxed ? 'MAXED' : room ? 'BUY' : 'NO SPACE';
      el.innerHTML = `<div class="name">${item.name}<span class="lvl">${lvl ? 'Lv' + lvl : ''}</span></div>
        <div class="effect">${describe(item)} · ${item.footprint} tile${item.footprint === 1 ? '' : 's'} · ${item.desc}</div>
        <button ${maxed ? 'disabled' : ''} data-cost="${cost}" data-fits="${room ? 1 : 0}">${label}<span class="cost">${maxed ? '' : fmt(cost)}</span></button>`;
      el.querySelector('button').addEventListener('click', () => buy(item));
      shop.appendChild(el);
    }
    // Expand: lights the next room
    const full = S.rooms >= maxRooms, rc = roomCost(S.rooms);
    const ex = document.createElement('div');
    ex.className = 'item expand' + (full ? ' maxed' : ''); ex.dataset.id = 'expand';
    ex.innerHTML = `<div class="name">${C.rooms.name}<span class="lvl">${S.rooms}/${maxRooms} rooms</span></div>
      <div class="effect">+<b>${ROOM_TILES}</b> tiles · ${C.rooms.desc}</div>
      <button ${full ? 'disabled' : ''} data-cost="${rc}" data-fits="1">${full ? 'FULL HOUSE' : 'BUILD'}<span class="cost">${full ? '' : fmt(rc)}</span></button>`;
    ex.querySelector('button').addEventListener('click', buyRoom);
    shop.appendChild(ex);
    renderShopAffordability();
  };
  const renderShopAffordability = () => {
    document.querySelectorAll('.item button[data-cost]').forEach((b) => {
      if (b.textContent.startsWith('MAXED') || b.textContent.startsWith('FULL')) return;
      b.disabled = S.money < Number(b.dataset.cost) || b.dataset.fits === '0';
    });
  };
  const renderTabs = () => {
    const build = (host, modes, axis) => {
      host.querySelectorAll('button').forEach((b) => b.remove());
      for (const [key, m] of Object.entries(modes)) {
        const b = document.createElement('button'); b.role = 'tab'; b.textContent = m.label;
        b.setAttribute('aria-selected', String(S[axis] === key));
        b.addEventListener('click', () => switchTo(axis === 'tap' ? key : S.tap, axis === 'idle' ? key : S.idle));
        host.appendChild(b);
      }
    };
    build($('tapTabs'), C.tapModes, 'tap'); build($('idleTabs'), C.idleModes, 'idle');
    $('hint').textContent = `${C.tapModes[S.tap].hint} ${C.idleModes[S.idle].hint}`;
  };
  const renderAll = () => { renderTabs(); renderMoney(); renderHack(); renderShop(); drawRoom(); };

  // ---------- house: isometric floor plan (placeholder pixel art) ----------
  // Logical canvas 304x204 shown at 3x. A tile is a 16x8 diamond; world tile
  // (0,0) is the back corner of the start room. The camera looks from the
  // south: the two back walls stand tall, the player faces the desk and shows
  // us their back. Look: a cluttered hacker bedroom, warm plaster and worn
  // tile, cyan screens, red neon through the blinds.
  const ctx = $('room').getContext('2d');
  const CW = 304, CH = 204, TW = 8, TH = 4, OX = 152, OY = 100, WALL = 44, SCALE = 3;
  const P = {
    void: '#07050a', floor: '#3e3027', floorLine: '#2e241c', floorWorn: '#352920', edge: '#241a14',
    wallN: '#4a3a32', wallW: '#3b2e28', wallCap: '#6a574b',
    wood: '#3a2a22', woodDark: '#2a1d17', woodLight: '#4a372c',
    metal: '#1e1c1c', metalDark: '#141313', metalLight: '#2a2727',
    cyan: '#35e0dc', cyanDim: '#136b69', cyanDeep: '#0b2a2c',
    red: '#ff3344', redDim: '#7a1228', neon: '#c8242a', neonDark: '#3a0a0c',
    leaf: '#2e6b3a', leafDark: '#1f4a2a', rug: '#5a1a1c', rugLine: '#7a2a2a', rugDark: '#43121a',
    hair: '#1a1412', hoodie: '#151c2e', hoodieDark: '#0e1320', chair: '#1a1a1a',
    bed: '#2a3028', bedDark: '#1e241e', pillow: '#6a3a2a', lamp: '#ffb64a', paper: '#d9cdb8', cork: '#5a4330',
  };
  const iso = (x, y) => [OX + (x - y) * TW, OY + (x + y) * TH];
  const path = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); };
  const poly = (pts, c) => { ctx.fillStyle = c; path(pts); ctx.fill(); };
  const outline = (pts, c, w = 1) => { ctx.strokeStyle = c; ctx.lineWidth = w; path(pts); ctx.stroke(); };
  const line = (a, b, c, w = 1) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
  const quad = (x, y, w, d, z = 0) => [iso(x, y), iso(x + w, y), iso(x + w, y + d), iso(x, y + d)].map(([px, py]) => [px, py - z]);
  // cuboid on tile (x, y), footprint w x d, h px tall, lifted z px. `left` is
  // the face toward the camera's left (+y side), `right` toward +x.
  const box = (x, y, w, d, h, top, left, right, z = 0) => {
    const [, b, c, l] = quad(x, y, w, d, z);
    poly([l, c, [c[0], c[1] - h], [l[0], l[1] - h]], left);
    poly([c, b, [b[0], b[1] - h], [c[0], c[1] - h]], right);
    poly(quad(x, y, w, d, z + h), top);
  };
  const dot = (x, y, z, c, size = 1) => { const [px, py] = iso(x, y); ctx.fillStyle = c; ctx.fillRect(Math.round(px - size / 2), Math.round(py - z - size / 2), size, size); };
  const blink = (period, phase = 0) => (Math.floor(Date.now() / period) + phase) % 3 !== 0;
  // points on the start room's back walls: north wall runs along y = 0, west wall along x = 0
  const onN = (x, z) => { const [px, py] = iso(x, 0); return [px, py - z]; };
  const onW = (y, z) => { const [px, py] = iso(0, y); return [px, py - z]; };

  // one sprite per occupied equipment tile
  const sprites = {
    keyboard: (x, y) => { box(x + .15, y + .2, .7, .6, 3, P.metal, P.metalDark, P.metalLight); const a = iso(x + .22, y + .8), b = iso(x + .82, y + .8); line([a[0], a[1] - 3], [b[0], b[1] - 3], P.cyan); },
    monitor:  (x, y) => { box(x + .2, y + .25, .6, .5, 5, P.metalLight, P.cyan, P.metal); },
    laptop:   (x, y) => { box(x + .15, y + .15, .7, .7, 4, P.wood, P.woodDark, P.woodLight); box(x + .3, y + .3, .4, .4, 1, P.cyanDeep, P.metal, P.metal, 4); dot(x + .5, y + .5, 6, P.cyan); },
    rack:     (x, y) => { box(x + .15, y + .15, .7, .7, 18, P.metalLight, P.metalDark, P.metal); for (let i = 0; i < 5; i++) dot(x + .78, y + .62, 4 + i * 3, blink(400, i + x) ? P.red : P.redDim); },
    gpu:      (x, y) => { box(x + .2, y + .2, .6, .6, 10, P.metal, P.metalDark, P.metalLight); for (let i = 0; i < 4; i++) dot(x + .75, y + .65, 3 + i * 2, i % 2 ? P.red : P.cyan); },
    botnet:   (x, y) => { box(x + .4, y + .4, .2, .2, 14, P.metalLight, P.metalDark, P.metal); dot(x + .5, y + .5, 16, blink(300, x + y) ? P.red : P.cyan, 2); },
  };

  // furniture in the start room
  const plant = (x, y, z = 0, s = 1) => {
    box(x + .3, y + .3, .4, .4, 4 * s, P.woodDark, P.wood, P.woodLight, z);
    const [px, py] = iso(x + .5, y + .5);
    [[0, 9, P.leaf], [-4, 7, P.leafDark], [4, 7, P.leafDark], [-2, 12, P.leaf], [3, 12, P.leafDark], [0, 15, P.leaf]]
      .forEach(([dx, dz, c]) => poly([[px + dx * s, py - z - dz * s - 3 * s], [px + (dx - 3) * s, py - z - dz * s + s], [px + (dx + 3) * s, py - z - dz * s + s]], c));
  };
  const deskN = (x, screen) => {
    box(x, .15, 1, .75, 7, P.wood, P.woodDark, P.woodLight);
    if (screen) {
      box(x + .15, .2, .7, .1, 6, P.metalLight, P.cyan, P.metal, 7);
      const a = iso(x + .22, .3), b = iso(x + .78, .3);
      for (let i = 0; i < 3; i++) line([a[0] + 1, a[1] - 8.5 - i * 1.6], [b[0] - 1 - i * 2, b[1] - 8.5 - i * 1.6], P.cyanDeep);
    }
    if (x === 2) { const a = iso(2.3, .85), b = iso(2.75, .85); line([a[0], a[1] - 7], [b[0], b[1] - 7], P.cyan); }
  };
  const deskW = (y) => {
    box(.15, y, .75, 1, 7, P.wood, P.woodDark, P.woodLight);
    if (y === 1) { box(.3, y + .2, .5, .6, 10, P.metal, P.metalDark, P.metalLight, 7); for (let i = 0; i < 3; i++) dot(.82, y + .5, 9 + i * 2.5, blink(600, i) ? P.cyan : P.cyanDim); }
    if (y === 2) plant(0, y, 7, .6);
  };
  const player = () => {
    box(2.3, 1.3, .4, .4, 3, P.chair, '#0e0e0e', '#141414');
    box(2.32, 1.34, .36, .36, 8, P.hoodie, P.hoodieDark, P.hoodie, 3);
    box(2.38, 1.4, .24, .24, 4, P.hair, P.hair, '#221a16', 11);
    box(2.28, 1.72, .44, .1, 10, P.chair, '#0e0e0e', '#222', 3);          // chair back, nearest the camera
  };
  const bed = () => {
    box(4.1, 4.1, 1.8, 1.8, 3, P.wood, P.woodDark, P.woodLight);
    box(4.15, 4.15, 1.7, 1.7, 4, P.bed, P.bedDark, P.bed, 3);
    box(4.25, 4.2, 1.5, .5, 2, P.pillow, '#4a2a1e', P.pillow, 7);
    poly(quad(4.15, 4.15, 1.7, 1.7, 7), 'rgba(255, 60, 60, .14)');             // neon on the blanket
  };
  const nightstand = () => {
    box(5.25, 3.25, .5, .5, 5, P.wood, P.woodDark, P.woodLight);
    box(5.4, 3.4, .2, .2, 4, P.lamp, '#b07a2a', '#d08f30', 5);
    dot(5.5, 3.5, 11, P.lamp, 3);
  };
  const shelf = () => {
    box(2.1, 5.15, 1.8, .7, 12, P.wood, P.woodDark, P.woodLight);
    const books = [P.red, P.cyanDim, '#8a6a3a', P.wood, P.red, '#d9cdb8', P.cyanDim, '#8a6a3a'];
    books.forEach((c, i) => { const [px, py] = iso(2.25 + i * .2, 5.85); line([px, py - 2], [px, py - 6], c); line([px, py - 7], [px, py - 11], books[(i + 3) % books.length]); });
    plant(2.6, 5.1, 12, .5);
  };

  const drawRoom = () => {
    ctx.fillStyle = P.void; ctx.fillRect(0, 0, CW, CH);
    const all = [];
    for (let ry = -1; ry <= 1; ry++) for (let rx = -1; rx <= 1; rx++) all.push([rx, ry]);
    all.sort((p, q) => p[0] + p[1] - (q[0] + q[1]));
    const lit = (rx, ry) => isLit(S, rx, ry);

    // floors: lit rooms get worn tiles, dark rooms a faint outline; a floor edge hangs below exterior front edges
    for (const [rx, ry] of all) {
      const x0 = rx * SIDE, y0 = ry * SIDE;
      if (!lit(rx, ry)) { poly(quad(x0, y0, SIDE, SIDE), '#0b080c'); outline(quad(x0, y0, SIDE, SIDE), '#17101a'); continue; }
      poly(quad(x0, y0, SIDE, SIDE), P.floor);
      for (let i = 0; i < SIDE * 2; i++) for (let j = 0; j < SIDE * 2; j++) if ((i * 7 + j * 13 + rx * 3 + ry * 5) % 6 === 0) poly(quad(x0 + i / 2, y0 + j / 2, .5, .5), P.floorWorn);
      for (let i = 1; i < SIDE * 2; i++) { line(iso(x0 + i / 2, y0), iso(x0 + i / 2, y0 + SIDE), P.floorLine); line(iso(x0, y0 + i / 2), iso(x0 + SIDE, y0 + i / 2), P.floorLine); }
      if (!lit(rx, ry + 1)) { const l = iso(x0, y0 + SIDE), c = iso(x0 + SIDE, y0 + SIDE); poly([l, c, [c[0], c[1] + 3], [l[0], l[1] + 3]], P.edge); }
      if (!lit(rx + 1, ry)) { const c = iso(x0 + SIDE, y0 + SIDE), r = iso(x0 + SIDE, y0); poly([c, r, [r[0], r[1] + 3], [c[0], c[1] + 3]], P.edge); }
    }
    // tall back walls on the exterior edges of lit rooms, with a lighter cap for thickness
    for (const [rx, ry] of all) {
      if (!lit(rx, ry)) continue;
      const x0 = rx * SIDE, y0 = ry * SIDE, a = iso(x0, y0);
      if (!lit(rx, ry - 1)) { const b = iso(x0 + SIDE, y0); poly([a, b, [b[0], b[1] - WALL], [a[0], a[1] - WALL]], P.wallN); line([a[0], a[1] - WALL], [b[0], b[1] - WALL], P.wallCap, 2); }
      if (!lit(rx - 1, ry)) { const d = iso(x0, y0 + SIDE); poly([a, d, [d[0], d[1] - WALL], [a[0], a[1] - WALL]], P.wallW); line([a[0], a[1] - WALL], [d[0], d[1] - WALL], P.wallCap, 2); }
    }
    // start room wall dressing
    if (!lit(0, -1)) {
      line(onN(0, 40), onN(SIDE, 40), P.metalLight); line(onN(2.5, 40), onN(2.5, 31), P.metalLight);          // conduit
      box(1.1, .05, 1.8, .3, 1, P.wood, P.woodDark, P.woodLight, 26);                                          // wall shelf
      for (let i = 0; i < 3; i++) { box(1.2 + i * .6, .05, .45, .28, 5, P.metalLight, P.metalDark, P.metal, 27); dot(1.5 + i * .6, .36, 30, blink(500, i) ? P.cyan : P.cyanDim); }
      poly([onN(.3, 34), onN(.9, 34), onN(.9, 22), onN(.3, 22)], '#1a1416'); poly([onN(.4, 31), onN(.8, 31), onN(.8, 25), onN(.4, 25)], '#6a1a1a');  // poster
      poly([onN(3.7, 41), onN(SIDE, 41), onN(SIDE, 2), onN(3.7, 2)], 'rgba(255, 60, 60, .10)');               // neon wash on the wall
      poly([onN(4.1, 36), onN(5.6, 36), onN(5.6, 8), onN(4.1, 8)], P.neonDark);                               // window
      for (let z = 9; z < 36; z += 2) line(onN(4.1, z), onN(5.6, z), z % 4 ? P.neon : P.neonDark);              // blinds
      outline([onN(4.05, 36.5), onN(5.65, 36.5), onN(5.65, 7.5), onN(4.05, 7.5)], P.metal);
    }
    if (!lit(-1, 0)) {
      line(onW(0, 40), onW(SIDE, 40), P.metalLight);
      poly([onW(1.2, 34), onW(2.6, 34), onW(2.6, 20), onW(1.2, 20)], '#1a1416'); poly([onW(1.5, 31), onW(2.3, 31), onW(2.3, 23), onW(1.5, 23)], '#5a1414');  // poster
      poly([onW(3, 31), onW(4.8, 31), onW(4.8, 19), onW(3, 19)], P.cork);                                       // pinboard
      [[3.2, 28], [3.6, 24], [4.1, 27], [4.4, 22], [3.9, 21], [3.3, 22]].forEach(([y, z]) => { const [px, py] = onW(y, z); ctx.fillStyle = P.paper; ctx.fillRect(px, py, 2, 2); });
      line(onW(3.2, 27), onW(4.4, 23), P.red); line(onW(3.6, 23), onW(4.1, 26), P.red);
    }
    // floor dressing in the start room
    poly(quad(1, 2, 3, 3), P.rug); outline(quad(1.25, 2.25, 2.5, 2.5), P.rugLine);
    for (let i = 0; i < 40; i++) dot(1 + ((i * 7) % 30) / 10, 2 + ((i * 11) % 30) / 10, 0, P.rugDark);
    if (!lit(0, -1)) poly([iso(4, .05), iso(5.7, .05), iso(6, 2.6), iso(3.6, 2.6)], 'rgba(255, 60, 60, .16)');  // neon on the floor
    poly(quad(4.6, 2.6, 1.4, 1.4), 'rgba(255, 182, 74, .07)');                                                      // lamp light

    // objects, depth-sorted by tile (x + y); multi-tile furniture uses its nearest tile
    const objs = [];
    const L = (id) => S.levels[id] || 0;
    const screens = Math.min(3, 1 + Math.floor(L('monitor') / 10));
    [1, 2, 3].forEach((x, i) => objs.push({ d: x, f: () => deskN(x, i < screens) }));
    [1, 2].forEach((y) => objs.push({ d: y, f: () => deskW(y) }));
    objs.push({ d: 3, f: player }, { d: 10, f: bed }, { d: 8, f: nightstand }, { d: 8, f: shelf }, { d: 5, f: () => plant(0, 5) }, { d: 5, f: () => plant(5, 0) });
    for (const p of placements(S)) objs.push({ d: p.x + p.y, f: () => (sprites[p.item.id] || sprites.laptop)(p.x, p.y) });
    objs.sort((a, b) => a.d - b.d).forEach((o) => o.f());
  };
  setInterval(() => { if (S) drawRoom(); }, 300);
  // centre the view on the start room (walls included); phones pan by touch, mice by dragging
  const centerHouse = () => {
    const sc = $('roomScroll'), [cx, cy] = iso(SIDE / 2, SIDE / 2);
    sc.scrollLeft = cx * SCALE - sc.clientWidth / 2; sc.scrollTop = (cy - WALL / 2 - 4) * SCALE - sc.clientHeight / 2;
  };
  window.addEventListener('resize', centerHouse);
  (() => {
    const sc = $('roomScroll'); let drag = null;
    sc.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; drag = { x: e.clientX, y: e.clientY, l: sc.scrollLeft, t: sc.scrollTop }; sc.classList.add('dragging'); sc.setPointerCapture(e.pointerId); });
    sc.addEventListener('pointermove', (e) => { if (!drag) return; sc.scrollLeft = drag.l - (e.clientX - drag.x); sc.scrollTop = drag.t - (e.clientY - drag.y); });
    const end = () => { drag = null; sc.classList.remove('dragging'); };
    sc.addEventListener('pointerup', end); sc.addEventListener('pointercancel', end);
  })();

  // ---------- slots / overlay ----------
  const comboTitle = (tap, idle) => `${C.tapModes[tap].label} / ${C.idleModes[idle].label}`.toUpperCase();
  const minutes = (ms) => Math.round(ms / 60000);
  const showOverlay = (tap, idle) => {
    const existing = load(slotKey(tap, idle));
    $('ovTitle').textContent = comboTitle(tap, idle);
    const acts = $('ovActions'); acts.innerHTML = '';
    const mk = (label, cls, fn) => { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.addEventListener('click', fn); acts.appendChild(b); return b; };
    if (existing) {
      $('ovBody').innerHTML = `Saved run: <b>${fmt(existing.money)}</b> in the bank, <b>${minutes(existing.playedMs)} min</b> played.<br>Continue it or wipe this slot and start over.`;
      mk('CONTINUE', 'primary', () => { start(existing); hideOverlay(); });
      mk('NEW RUN (wipe this slot)', 'danger', () => { start(freshState(tap, idle)); hideOverlay(); });
    } else {
      $('ovBody').innerHTML = `${C.tapModes[tap].hint} ${C.idleModes[idle].hint}<br>No save for this combo yet.`;
      mk('START', 'primary', () => { start(freshState(tap, idle)); hideOverlay(); });
    }
    if (S) mk('BACK', '', hideOverlay);
    $('overlay').hidden = false;
  };
  const hideOverlay = () => { $('overlay').hidden = true; };

  const applyOffline = (s) => {
    const r = idleRate(s); if (r <= 0) return;
    const secs = Math.min(C.offlineCapSeconds, Math.max(0, (Date.now() - s.lastSeen) / 1000));
    const gain = r * secs * C.offlineEfficiency;
    if (gain >= 1) { s.money += gain; s.totalEarned += gain; setTimeout(() => { pop($('tapzone').clientWidth / 2, 20, `offline +${fmt(gain)}`, true); }, 300); }
  };
  const start = (state) => {
    if (S) save();
    S = state; S.rooms = S.rooms || 1; applyOffline(S); S.lastSeen = Date.now();
    if (S.tap === 'jobs' && S.job && Date.now() - S.job.start < 0) S.job = null;
    store(`ra${C.version}:last`, { tap: S.tap, idle: S.idle });
    renderAll(); centerHouse(); save();
  };
  const switchTo = (tap, idle) => { if (S && tap === S.tap && idle === S.idle) return; save(); showOverlay(tap, idle); };

  // ---------- wire up ----------
  $('hack').addEventListener('pointerdown', (e) => { e.preventDefault(); onTap(e); });
  $('hack').addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onTap({}); } });
  $('menuBtn').addEventListener('click', () => showOverlay(S.tap, S.idle));
  const renderMute = () => { $('muteBtn').textContent = muted ? 'MUTED' : 'SND'; $('muteBtn').setAttribute('aria-pressed', String(muted)); };
  $('muteBtn').addEventListener('click', () => { muted = !muted; store(`ra${C.version}:muted`, muted); renderMute(); if (!muted) beep(880, .05); });
  renderMute();

  const last = load(`ra${C.version}:last`) || { tap: C.defaultTap, idle: C.defaultIdle };
  const saved = load(slotKey(last.tap, last.idle));
  if (saved) start(saved);
  else { S = freshState(last.tap, last.idle); renderAll(); showOverlay(last.tap, last.idle); }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
